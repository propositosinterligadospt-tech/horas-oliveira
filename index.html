<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Registo de Horas — Propósitos Interligados</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #2D6A4F;
  --accent-light: #D8F3DC;
  --accent-text: #1B4332;
}
body {
  font-family: 'DM Sans', sans-serif;
  background: #F0F4F0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.5rem 1rem 3rem;
}
.top {
  width: 100%;
  max-width: 400px;
  margin-bottom: 1.25rem;
  text-align: center;
}
.company {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 4px;
}
.pro-name {
  font-size: 22px;
  font-weight: 600;
  color: #1A1A18;
  letter-spacing: -0.3px;
}
.card {
  width: 100%;
  max-width: 400px;
  background: #fff;
  border-radius: 18px;
  padding: 1.5rem;
  box-shadow: 0 2px 16px rgba(0,0,0,0.07);
  margin-bottom: 1rem;
}
.section-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #9A9990;
  margin-bottom: 1rem;
}
.field { margin-bottom: 1rem; }
.field:last-child { margin-bottom: 0; }
label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #555;
  margin-bottom: 5px;
}
input[type="date"],
input[type="time"],
input[type="text"] {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #E8E8E4;
  border-radius: 12px;
  background: #FAFAF8;
  color: #1A1A18;
  font-size: 16px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color 0.15s;
}
input[type="date"],
input[type="time"] { font-size: 18px; }
input:focus {
  outline: none;
  border-color: var(--accent);
  background: #fff;
}
.obra-hint {
  font-size: 12px;
  color: #AAA;
  margin-top: 5px;
}
.divider {
  border: none;
  border-top: 1px solid #F0F0EC;
  margin: 1rem 0;
}
.total-box {
  background: var(--accent-light);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.total-label { font-size: 13px; font-weight: 500; color: var(--accent-text); }
.total-value { font-size: 22px; font-weight: 600; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.almoco-box {
  background: #F5F5F0;
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
}
.almoco-label { font-size: 12px; color: #888; }
.almoco-value { font-size: 15px; font-weight: 500; color: #555; }
textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #E8E8E4;
  border-radius: 12px;
  background: #FAFAF8;
  color: #1A1A18;
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  resize: none;
  min-height: 80px;
}
textarea:focus { outline: none; border-color: var(--accent); }
.btn-whatsapp {
  width: 100%;
  max-width: 400px;
  padding: 16px;
  background: #25D366;
  color: #fff;
  border: none;
  border-radius: 16px;
  font-size: 17px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 4px 14px rgba(37,211,102,0.35);
  transition: transform 0.12s, box-shadow 0.12s;
}
.btn-whatsapp:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(37,211,102,0.2); }
.wa-icon { width: 22px; height: 22px; }
.error-msg {
  background: #FFF0F0;
  border: 1px solid #FFD0D0;
  color: #C0392B;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 1rem;
  display: none;
  width: 100%;
  max-width: 400px;
  text-align: center;
}
</style>
</head>
<body>

<div class="top">
  <p class="company">Propósitos Interligados</p>
  <p class="pro-name" id="pro-label">Oliveira</p>
</div>

<div class="card">
  <p class="section-label">Local &amp; data</p>
  <div class="field">
    <label>Local da obra</label>
    <input type="text" id="obra" placeholder="Ex: Rua das Flores, Lisboa">
    <p class="obra-hint">Escreva o nome ou morada da obra de hoje</p>
  </div>
  <div class="field">
    <label>Data</label>
    <input type="date" id="data">
  </div>
</div>

<div class="card">
  <p class="section-label">Horários</p>
  <div class="field">
    <label>Entrada</label>
    <input type="time" id="entrada">
  </div>
  <div class="field">
    <label>Saída para almoço</label>
    <input type="time" id="saida-almoco">
  </div>
  <div class="field">
    <label>Retorno do almoço</label>
    <input type="time" id="retorno-almoco">
  </div>
  <div class="field">
    <label>Saída final</label>
    <input type="time" id="saida-final">
  </div>
  <hr class="divider">
  <div class="total-box">
    <span class="total-label">Total trabalhado</span>
    <span class="total-value" id="total-display">--h --m</span>
  </div>
  <div class="almoco-box">
    <span class="almoco-label">Intervalo de almoço</span>
    <span class="almoco-value" id="almoco-display">--h --m</span>
  </div>
</div>

<div class="card">
  <p class="section-label">Nota (opcional)</p>
  <textarea id="nota" placeholder="Ex: trabalho remoto, reunião extra, falta de material..."></textarea>
</div>

<div class="error-msg" id="error-msg">Por favor preencha o local da obra, data, hora de entrada e saída final.</div>

<button class="btn-whatsapp" onclick="enviarWhatsApp()">
  <svg class="wa-icon" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
  </svg>
  Enviar pelo WhatsApp
</button>

<script>
  // ════════════════════════════════════════
  // ALTERAR APENAS ESTA LINHA:
  const PROFISSIONAL = "Oliveira";
  // ════════════════════════════════════════

  const EMPRESA = "Propósitos Interligados";
  const WHATSAPP_DESTINO = "351939910536";

  document.getElementById('pro-label').textContent = PROFISSIONAL;
  document.getElementById('data').value = new Date().toISOString().slice(0, 10);

  function toMin(t) {
    if (!t) return null;
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  }

  function minToStr(m) {
    if (m == null || isNaN(m) || m < 0) return '--h --m';
    return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
  }

  function calcular() {
    const e = toMin(document.getElementById('entrada').value);
    const sa = toMin(document.getElementById('saida-almoco').value);
    const ra = toMin(document.getElementById('retorno-almoco').value);
    const sf = toMin(document.getElementById('saida-final').value);
    let total = null, almoco = null;
    if (e != null && sf != null) {
      total = sf - e;
      if (sa != null && ra != null) { almoco = ra - sa; total -= almoco; }
    } else if (sa != null && ra != null) {
      almoco = ra - sa;
    }
    document.getElementById('total-display').textContent = minToStr(total);
    document.getElementById('almoco-display').textContent = minToStr(almoco);
  }

  ['entrada','saida-almoco','retorno-almoco','saida-final'].forEach(id => {
    document.getElementById(id).addEventListener('change', calcular);
  });

  function enviarWhatsApp() {
    const obra  = document.getElementById('obra').value.trim();
    const data  = document.getElementById('data').value;
    const ent   = document.getElementById('entrada').value;
    const sa    = document.getElementById('saida-almoco').value;
    const ra    = document.getElementById('retorno-almoco').value;
    const sf    = document.getElementById('saida-final').value;
    const nota  = document.getElementById('nota').value.trim();
    const errEl = document.getElementById('error-msg');

    if (!obra || !data || !ent || !sf) { errEl.style.display = 'block'; return; }
    errEl.style.display = 'none';

    const eM = toMin(ent), saM = toMin(sa), raM = toMin(ra), sfM = toMin(sf);
    let total = sfM - eM, almoco = null;
    if (saM != null && raM != null) { almoco = raM - saM; total -= almoco; }

    const dataFmt = new Date(data + 'T12:00:00').toLocaleDateString('pt-PT', { day: '2-digit', month: 'long', year: 'numeric' });

    let msg = `📋 *Registo de Horas*\n`;
    msg += `🏢 ${EMPRESA}\n`;
    msg += `👤 ${PROFISSIONAL}\n`;
    msg += `📅 ${dataFmt}\n`;
    msg += `📍 ${obra}\n\n`;
    msg += `🕐 Entrada: ${ent}\n`;
    if (sa) msg += `🍽️ Saída almoço: ${sa}\n`;
    if (ra) msg += `↩️ Retorno almoço: ${ra}\n`;
    msg += `🕔 Saída final: ${sf}\n\n`;
    if (almoco != null) msg += `⏸️ Intervalo: ${minToStr(almoco)}\n`;
    msg += `✅ *Total trabalhado: ${minToStr(total)}*`;
    if (nota) msg += `\n\n📝 Nota: ${nota}`;

    window.open(`https://wa.me/${WHATSAPP_DESTINO}?text=${encodeURIComponent(msg)}`, '_blank');
  }
</script>
</body>
</html>
